<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="DJ Electrical LLC - Electrical services in Greenville, South Carolina and surrounding areas.">

  <title>DJ Electrical LLC | Electrical Services</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06152d;
    }

    #portfolio {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #06152d;
    }

    #loading {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06152d;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div id="loading">
    Loading DJ Electrical...
  </div>

  <!--
    THIS LOADS YOUR ORIGINAL COMPLETE PORTFOLIO.
    All images, logo, background and design remain intact.
  -->
  <iframe
    id="portfolio"
    src="DJ_Electrical_Portafolio_Actualizado.html"
    title="DJ Electrical LLC">
  </iframe>


<script>

  const iframe = document.getElementById("portfolio");
  const loading = document.getElementById("loading");


  /*
  ============================================================
  ENGLISH TRANSLATIONS
  ============================================================
  */

  const translations = {

    "Español": "Español",

    "LLAMAR AHORA": "CALL NOW",
    "Llamar ahora": "Call now",
    "LLAME AHORA": "CALL NOW",

    "VER PROYECTOS": "VIEW PROJECTS",
    "Ver proyectos": "View projects",

    "EXCELENCIA ELÉCTRICA PARA UN MUNDO MODERNO.":
      "ELECTRICAL EXCELLENCE FOR A MODERN WORLD.",

    "Excelencia eléctrica para un mundo moderno.":
      "Electrical excellence for a modern world.",

    "Soluciones eléctricas para proyectos comerciales, industriales y residenciales, con enfoque en calidad, seguridad y confianza.":
      "Electrical solutions for commercial, industrial, and residential projects, focused on quality, safety, and trust.",

    "CALIDAD": "QUALITY",
    "SEGURIDAD": "SAFETY",
    "CONFIANZA": "TRUST",

    "Calidad": "Quality",
    "Seguridad": "Safety",
    "Confianza": "Trust",

    "PROYECTOS": "PROJECTS",
    "Proyectos": "Projects",

    "SERVICIOS": "SERVICES",
    "Servicios": "Services",

    "CONTACTO": "CONTACT",
    "Contacto": "Contact",

    "NOSOTROS": "ABOUT US",
    "Nosotros": "About Us",

    "SOBRE NOSOTROS": "ABOUT US",
    "Sobre nosotros": "About Us",

    "Acerca de nosotros": "About Us",
    "Acerca de": "About",

    "INICIO": "HOME",
    "Inicio": "Home",

    "Galería": "Gallery",
    "GALERÍA": "GALLERY",

    "Nuestros servicios": "Our Services",
    "Nuestros proyectos": "Our Projects",

    "Proyectos completados": "Completed Projects",
    "Proyectos terminados": "Completed Projects",

    "Proyectos en curso": "Ongoing Projects",

    "Proyectos recientes": "Recent Projects",

    "Proyectos destacados": "Featured Projects",

    "Ver más": "View More",

    "Leer más": "Read More",

    "Más información": "More Information",
    "MÁS INFORMACIÓN": "MORE INFORMATION",

    "Solicitar cotización": "Request a Quote",

    "Cotización": "Quote",

    "Llámame": "Call Me",
    "Llámanos": "Call Us",

    "Teléfono": "Phone",

    "Trabajo eléctrico": "Electrical Work",

    "Nuestros trabajos": "Our Work",

    "En progreso": "In Progress",
    "Completado": "Completed",

    "Sirviendo Greenville, Carolina del Sur y áreas circundantes.":
      "Serving Greenville, South Carolina and surrounding areas.",

    "Greenville, Carolina del Sur":
      "Greenville, South Carolina",

    "áreas circundantes":
      "surrounding areas"

  };


  /*
  ============================================================
  TRANSLATE TEXT
  ============================================================
  */

  function translatePage() {

    try {

      const doc = iframe.contentDocument;

      if (!doc || !doc.body) {
        return;
      }

      /*
        Change page language.
      */
      doc.documentElement.lang = "en";


      /*
        Change title.
      */
      doc.title =
        "DJ Electrical LLC | Electrical Services in Greenville, SC";


      /*
        Translate visible text without touching images,
        HTML structure or CSS.
      */
      const walker = doc.createTreeWalker(
        doc.body,
        NodeFilter.SHOW_TEXT
      );

      const nodes = [];

      while (walker.nextNode()) {
        nodes.push(walker.currentNode);
      }


      nodes.forEach(function(node) {

        let text = node.nodeValue;

        if (!text || !text.trim()) {
          return;
        }

        Object.keys(translations).forEach(function(spanish) {

          const english = translations[spanish];

          text = text.split(spanish).join(english);

        });

        node.nodeValue = text;

      });


      /*
      ========================================================
      LANGUAGE BUTTONS
      ========================================================
      */

      const links = doc.querySelectorAll("a");

      links.forEach(function(link) {

        const text =
          (link.textContent || "")
          .trim()
          .toLowerCase();

        const href =
          link.getAttribute("href") || "";


        /*
          ENGLISH BUTTON

          If we are already on English,
          prevent it from opening en.html inside itself.
        */
        if (
          text.includes("english") ||
          href.toLowerCase().includes("en.html")
        ) {

          link.addEventListener("click", function(event) {

            event.preventDefault();

          });

        }


        /*
          SPANISH BUTTON

          Return to the normal Spanish page.
        */
        if (
          text.includes("español")
        ) {

          link.setAttribute(
            "href",
            "index.html"
          );

          link.addEventListener("click", function(event) {

            event.preventDefault();

            window.top.location.href = "index.html";

          });

        }

      });


      /*
        Hide loading screen.
      */
      loading.classList.add("hidden");

    }

    catch (error) {

      console.log(
        "Translation error:",
        error
      );

    }

  }


  /*
  ============================================================
  WHEN THE COMPLETE PORTFOLIO LOADS
  ============================================================
  */

  iframe.addEventListener(
    "load",
    function() {

      /*
        Give the original page a moment
        to finish loading its images.
      */
      setTimeout(
        translatePage,
        500
      );

    }
  );


  /*
  ============================================================
  SAFETY FALLBACK
  ============================================================
  */

  setTimeout(
    function() {

      loading.classList.add("hidden");

    },
    8000
  );

</script>

</body>
</html>
